<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MineQuest 3D</title><style>body{margin:0;overflow:hidden;font:15px Arial;background:#87ceeb}#hud{position:fixed;top:10px;left:10px;background:#000a;color:white;padding:12px;border-radius:8px;z-index:2}#menu{position:fixed;inset:0;background:#001b2acc;display:grid;place-items:center;z-index:5;color:white;text-align:center}#panel{background:#173c48;padding:25px;border-radius:15px;max-width:500px}button{padding:13px 25px;background:#4baf62;color:white;border:0;border-radius:8px;font-size:18px}#cross{position:fixed;top:50%;left:50%;color:white;font-size:25px;pointer-events:none}#bar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#000a;color:white;padding:10px;border-radius:8px}</style></head><body><div id="hud">❤️ <span id="hp">100</span> | Kills: <span id="kills">0</span><br>WASD move · Space jump · Shift sprint<br>Hold left click mine · Right click build<br>1–5 blocks · 6 pickaxe · 7 axe · 8 shovel · 9 sword<br>Backspace/Delete pause · <span id="status">Connecting…</span></div><div id="cross">+</div><div id="bar"></div><div id="menu"><div id="panel"><h1>⛏️ MineQuest 3D</h1><p>Mine blocks, build houses, and explore a shared 3D world.</p><button id="play">PLAY</button><p>Use Backspace or Delete to pause.</p></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x62733a,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(15,25,10);scene.add(sun);
const kinds=['grass','dirt','stone','wood','leaves'],names=[...kinds,'pickaxe','axe','shovel','sword'],inventory=[64,64,64,64,64],colors=['#5aab45','#805635','#888888','#80502d','#348445'],materials={};for(let i=0;i<5;i++){const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');g.fillStyle=colors[i];g.fillRect(0,0,32,32);let s=i+17;for(let j=0;j<180;j++){s=(s*1664525+1013904223)>>>0;const x=s%32;s=(s*1664525+1013904223)>>>0;const y=s%32;g.fillStyle=j%2?'#ffffff22':'#00000022';g.fillRect(x,y,2,2)}const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;materials[kinds[i]]=new THREE.MeshLambertMaterial({map:t})}
const blocks=new Map(),geo=new THREE.BoxGeometry(1,1,1),key=(x,y,z)=>x+','+y+','+z;function add(x,y,z,t){const k=key(x,y,z);if(blocks.has(k)||!materials[t])return;const m=new THREE.Mesh(geo,materials[t]);m.position.set(x,y,z);m.userData={x,y,z,t};scene.add(m);blocks.set(k,m)}function remove(x,y,z){const k=key(x,y,z),m=blocks.get(k);if(m){scene.remove(m);blocks.delete(k)}}function height(x,z){return Math.floor(Math.sin(x*.22)+Math.cos(z*.24))}for(let x=-23;x<=23;x++)for(let z=-23;z<=23;z++){const h=height(x,z);for(let y=-3;y<=h;y++)add(x,y,z,y===h?'grass':y>=h-2?'dirt':'stone')}for(let x=-20;x<=20;x+=7)for(let z=-20;z<=20;z+=9){if(Math.abs(x)<5&&Math.abs(z)<5)continue;let h=height(x,z);for(let y=h+1;y<h+5;y++)add(x,y,z,'wood');for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=3;dy<=5;dy++)if(Math.abs(dx)+Math.abs(dz)<4)add(x+dx,h+dy,z+dz,'leaves')}
let socket;try{socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);socket.onopen=()=>document.getElementById('status').textContent='Shared world connected';socket.onclose=()=>document.getElementById('status').textContent='Offline mode';socket.onmessage=e=>{const m=JSON.parse(e.data);const apply=(x,y,z,t)=>{remove(x,y,z);if(t)add(x,y,z,t)};if(m.type==='world')for(const [k,t] of Object.entries(m.edits)){const [x,y,z]=k.split(',').map(Number);apply(x,y,z,t)}if(m.type==='block')apply(m.x,m.y,m.z,m.block)}}catch{}
const player={pos:new THREE.Vector3(0,height(0,0)+2.7,0),vy:0},keys={},ray=new THREE.Raycaster(),dir=new THREE.Vector3(),menu=document.getElementById('menu'),bar=document.getElementById('bar');ray.far=6;let yaw=0,pitch=0,selected=0,locked=false,grounded=false,held=false,target=null,progress=0;function hud(){bar.textContent=names.map((n,i)=>(i===selected?'[':'')+(i+1)+':'+n+(i<5?' '+inventory[i]:'')+(i===selected?']':'')).join('  ')}hud();document.getElementById('play').onclick=()=>renderer.domElement.requestPointerLock();document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;menu.style.display=locked?'none':'grid';held=false;keys.Space=false});document.addEventListener('mousemove',e=>{if(locked){yaw-=e.movementX*.0025;pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*.0025))}});document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'||e.code==='Backspace'||e.code==='Delete')e.preventDefault();if(e.code==='Backspace'||e.code==='Delete')document.exitPointerLock();if(/^Digit[1-9]$/.test(e.code)){selected=Number(e.code.slice(-1))-1;hud()}});document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;held=false});document.addEventListener('contextmenu',e=>e.preventDefault());function aim(){camera.updateMatrixWorld();camera.getWorldDirection(dir);ray.set(camera.position,dir);return ray.intersectObjects([...blocks.values()])[0]}function change(x,y,z,t){if(t)add(x,y,z,t);else remove(x,y,z);if(socket?.readyState===1)socket.send(JSON.stringify({type:'block',x,y,z,block:t}))}document.addEventListener('mousedown',e=>{if(!locked)return;if(e.button===0)held=true;if(e.button===2&&selected<5&&inventory[selected]>0){const h=aim();if(!h)return;const p=h.object.position.clone().add(h.face.normal).round();if(Math.abs(p.x-player.pos.x)<.8&&Math.abs(p.z-player.pos.z)<.8&&Math.abs(p.y-player.pos.y)<2)return;if(blocks.has(key(p.x,p.y,p.z)))return;change(p.x,p.y,p.z,kinds[selected]);inventory[selected]--;hud()}});document.addEventListener('mouseup',e=>{if(e.button===0){held=false;target=null;progress=0}});
function collides(x,z,feet,head){for(let xx=Math.round(x-.28);xx<=Math.round(x+.28);xx++)for(let zz=Math.round(z-.28);zz<=Math.round(z+.28);zz++)for(let yy=Math.round(feet);yy<=Math.round(head);yy++)if(blocks.has(key(xx,yy,zz)))return true;return false}function floorAt(x,z,maxY){for(let y=Math.min(15,Math.floor(maxY));y>=-3;y--)if(blocks.has(key(Math.round(x),y,Math.round(z))))return y+.5;return -3.5}
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.045);last=now;camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;camera.position.copy(player.pos);if(locked){const f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),v=new THREE.Vector3();if(keys.KeyW)v.add(f);if(keys.KeyS)v.sub(f);if(keys.KeyA)v.sub(r);if(keys.KeyD)v.add(r);if(v.lengthSq())v.normalize().multiplyScalar((keys.ShiftLeft?7:4.5)*dt);const feet=player.pos.y-1.65;if(!collides(player.pos.x+v.x,player.pos.z,feet,player.pos.y-.15))player.pos.x+=v.x;if(!collides(player.pos.x,player.pos.z+v.z,feet,player.pos.y-.15))player.pos.z+=v.z;if(keys.Space&&grounded){player.vy=7.5;grounded=false}player.vy-=20*dt;player.pos.y+=player.vy*dt;const floor=floorAt(player.pos.x,player.pos.z,player.pos.y-1.65)+1.65;if(player.vy<=0&&player.pos.y<=floor){player.pos.y=floor;player.vy=0;grounded=true}player.pos.x=THREE.MathUtils.clamp(player.pos.x,-22,22);player.pos.z=THREE.MathUtils.clamp(player.pos.z,-22,22);camera.position.copy(player.pos);if(held&&selected!==8){const h=aim(),m=h?.object;if(m){if(target!==m){target=m;progress=0}let d=m.userData.t==='stone'?.9:m.userData.t==='wood'?.7:.4;if(selected===5&&m.userData.t==='stone'||selected===6&&m.userData.t==='wood'||selected===7&&['grass','dirt'].includes(m.userData.t))d*=.22;progress+=dt;if(progress>=d){const {x,y,z,t}=m.userData;change(x,y,z,null);inventory[kinds.indexOf(t)]++;hud();target=null;progress=0}}else{target=null;progress=0}}}renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
