const player={pos:new THREE.Vector3(0,height(0,0)+2.7,0),vy:0},keys={},ray=new THREE.Raycaster(),dir=new THREE.Vector3(),menu=document.getElementById('menu'),bar=document.getElementById('bar');ray.far=6;let yaw=0,pitch=0,locked=false,grounded=false,held=false,target=null,progress=0;function hud(){queueSave();bar.textContent=names.map((n,i)=>(i===selected?'[':'')+(i+1)+':'+n+(i<5?' '+inventory[i]:'')+(i===selected?']':'')).join('  ')}hud();document.getElementById('play').onclick=()=>renderer.domElement.requestPointerLock();document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;menu.style.display=locked?'none':'grid';held=false;target=null;progress=0;document.getElementById('cross').textContent='+';for(const code in keys)keys[code]=false});document.addEventListener('mousemove',e=>{if(locked){yaw-=e.movementX*.0025;pitch=Math.max(-1.5,Math.min(1.5,pitch-e.movementY*.0025))}});document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','Backspace','Delete','KeyW','KeyA','KeyS','KeyD'].includes(e.code))e.preventDefault();if(e.code==='Backspace'||e.code==='Delete')document.exitPointerLock();if(/^Digit[1-9]$/.test(e.code)){selected=Number(e.code.slice(-1))-1;held=false;target=null;progress=0;hud();refreshHeldModel();sound('select')}});document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;held=false});document.addEventListener('contextmenu',e=>e.preventDefault());function aim(){camera.updateMatrixWorld();camera.getWorldDirection(dir);ray.set(camera.position,dir);return ray.intersectObjects([...blocks.values()],false)[0]}function change(x,y,z,t){if(t)add(x,y,z,t);else remove(x,y,z);edits.set(key(x,y,z),t);queueSave();if(socket?.readyState===1)socket.send(JSON.stringify({type:'block',x,y,z,block:t}))}document.addEventListener('mousedown',e=>{if(!locked)return;if(e.button===0){held=true;target=null;progress=0;}if(e.button===2&&selected<5&&in
